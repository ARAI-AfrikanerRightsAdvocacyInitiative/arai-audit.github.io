<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ARAI | Forensic Audit FAQ</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; margin: 0; padding: 40px 20px; background: url('watermark.jpeg') no-repeat center center fixed; background-size: cover; background-color: #1a1a1a; color: #d0d0d0; line-height: 1.8; }
        .card { max-width: 960px; margin: 0 auto; background: rgba(22, 22, 22, 0.97); padding: 50px; border-radius: 12px; border: 1px solid #3a3a3a; box-shadow: 0 0 40px rgba(139, 90, 43, 0.25); }
        .header-logo { display: flex; align-items: center; justify-content: center; gap: 25px; border-bottom: 2px solid #b87333; padding-bottom: 20px; margin-bottom: 30px; }
        .nav-bar { text-align: center; margin: 20px 0; padding: 10px; border-top: 1px solid #4a4a4a; border-bottom: 1px solid #4a4a4a; }
        a { color: #d18d5a; text-decoration: none; font-weight: bold; }
        h1 { color: #b87333; text-transform: uppercase; }
        
        /* Accordion Style */
        .accordion { background-color: #1c1c1c; color: #d0d0d0; cursor: pointer; padding: 18px; width: 100%; border: 1px solid #4a4a4a; text-align: left; outline: none; font-size: 1.2em; font-family: 'Courier New', Courier, monospace; margin-top: 10px; }
        .panel { padding: 0 18px; display: none; background-color: #252525; border: 1px solid #333; margin-bottom: 10px; }
        .btn-main { display: inline-block; background-color: #27ae60; color: white; padding: 20px 40px; border-radius: 50px; font-size: 1.2em; margin-top: 40px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header-logo">
            <img src="1.png" style="width: 100px; height: 100px; border-radius: 50%; border: 2px solid #b87333;">
            <div><h1 style="margin:0; font-size: 1.5em;">FAQ | VRAE</h1></div>
        </div>

        <div class="nav-bar">
            <a href="index.html">HOME</a> | <a href="governance.html">GOVERNANCE</a> | <a href="faq.html">FAQ</a>
        </div>

        <h1>Understanding Your Rights</h1>
        <!-- FAQ ITEMS -->
        <button class="accordion">1. What does "partial denial" mean?</button>
        <div class="panel"><p>Standard FOIA term regarding withheld documents, not a rejection of your refugee status.</p></div>

        <button class="accordion">2. Is there an appeal process?</button>
        <div class="panel"><p>Consult a legal professional and utilize the CIS Ombudsman case review (6 U.S.C. § 272).</p></div>
        
        <!-- Voeg hier jou ander 8 vrae in dieselfde patroon by... -->

        <div style="text-align: center;">
            <a href="mailto:afrikaner.advocacy.audit@proton.me" class="btn-main">CONTACT THE CUSTODIAN</a>
        </div>
    </div>

    <script>
        var acc = document.getElementsByClassName("accordion");
        for (var i = 0; i < acc.length; i++) {
            acc[i].addEventListener("click", function() {
                this.classList.toggle("active");
                var panel = this.nextElementSibling;
                if (panel.style.display === "block") { panel.style.display = "none"; } 
                else { panel.style.display = "block"; }
            });
        }
    </script>
</body>
</html>
